<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love ✦</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030006;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    position: relative;
    color: white;
    cursor: pointer;
    user-select: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at center, transparent 20%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.82) 100%);
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .word {
    position: absolute;
    text-align: center;
    opacity: 0;
    transform: translateY(18px) scale(.94);
    filter: blur(12px);
    transition:
      opacity 1.2s ease,
      transform 1.5s cubic-bezier(.2,.8,.2,1),
      filter 1.5s ease;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-shadow:
      0 0 8px rgba(255, 47, 159, .95),
      0 0 28px rgba(255, 47, 159, .75),
      0 0 65px rgba(255, 0, 140, .35);
  }

  .word.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }

  #you, #are, #my {
    font-size: clamp(4.5rem, 19vw, 13rem);
    background: linear-gradient(180deg, #fff 0%, #ffb8e3 35%, #ff269b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #love {
    font-size: clamp(4.5rem, 19vw, 13rem);
    background: linear-gradient(180deg, #fff 0%, #ff9bd6 30%, #ff087e 75%, #9c0056 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .heart-wrap {
    position: absolute;
    width: min(78vw, 520px);
    height: min(68vw, 450px);
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(.72);
    filter: blur(8px);
    transition:
      opacity 1.5s ease,
      transform 1.8s cubic-bezier(.16,1.25,.3,1),
      filter 1.5s ease;
  }

  .heart-wrap.show {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
  }

  .heart-particles {
    position: absolute;
    inset: 0;
    overflow: visible;
  }

  .heart-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff63bd;
    box-shadow:
      0 0 5px #ff63bd,
      0 0 13px rgba(255, 0, 145, .9);
    animation: heartFloat 1.8s ease-in-out infinite alternate;
  }

  .heart-dot.small {
    width: 2px;
    height: 2px;
    opacity: .7;
  }

  .heart-message {
    position: relative;
    z-index: 3;
    margin-top: 2%;
    padding: 9px 16px;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(17px, 3.4vw, 29px);
    font-weight: 700;
    font-style: italic;
    white-space: nowrap;
    text-shadow:
      0 0 5px #ff70c4,
      0 0 14px #ff198f,
      0 0 28px rgba(255, 0, 140, .85);
  }

  @keyframes heartFloat {
    from { transform: translateY(0) scale(1); opacity: .55; }
    to { transform: translateY(-4px) scale(1.18); opacity: 1; }
  }

  .subtitle {
    position: absolute;
    bottom: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    font-size: clamp(11px, 2.8vw, 16px);
    letter-spacing: .08em;
    color: rgba(255, 202, 235, .9);
    opacity: 0;
    transition: opacity 1.2s ease 1s;
    text-shadow: 0 0 15px #ff0088;
  }

  .subtitle.show { opacity: 1; }

  .tap {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    padding: 12px 22px;
    border: 1px solid rgba(255, 102, 190, .45);
    border-radius: 999px;
    color: rgba(255,255,255,.8);
    background: rgba(255, 0, 128, .07);
    backdrop-filter: blur(10px);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    transition: opacity .5s ease, transform .5s ease;
  }

  .tap.hide {
    opacity: 0;
    transform: translateX(-50%) translateY(12px);
    pointer-events: none;
  }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .flash.go { animation: flash .55s ease-out; }

  @keyframes heartbeat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    12% { transform: rotate(-45deg) scale(1.08); }
    24% { transform: rotate(-45deg) scale(1); }
    38% { transform: rotate(-45deg) scale(1.05); }
    55% { transform: rotate(-45deg) scale(1); }
  }

  @keyframes corePulse {
    0%,100% { transform: rotate(45deg) scale(1); }
    15% { transform: rotate(45deg) scale(1.08); }
    30% { transform: rotate(45deg) scale(1); }
  }

  @keyframes flash {
    0% { opacity: 0; }
    25% { opacity: .2; }
    100% { opacity: 0; }
  }

  @media (max-width: 600px) {
    .heart-wrap { width: 76vw; height: 76vw; }
    .subtitle { bottom: 12%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="vignette"></div>

<div class="scene">
  <div id="you" class="word">YOU</div>
  <div id="are" class="word">ARE</div>
  <div id="my" class="word">MY</div>
  <div id="love" class="word">LOVE</div>

  <div id="heartWrap" class="heart-wrap">
    <div class="heart-particles" id="heartParticles"></div>
    <div class="heart-message">I Love ❤️ You Farah</div>
  </div>

  <div id="subtitle" class="subtitle">ربي يجيب تساهيل BAC 2027 ✦</div>
</div>

<div id="tap" class="tap">Tap anywhere to start</div>
<div id="flash" class="flash"></div>

<script>
(() => {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  const you = document.getElementById("you");
  const are = document.getElementById("are");
  const my = document.getElementById("my");
  const love = document.getElementById("love");
  const heartWrap = document.getElementById("heartWrap");
  const subtitle = document.getElementById("subtitle");
  const tap = document.getElementById("tap");
  const flash = document.getElementById("flash");

  let w, h, dpr;
  let particles = [];
  let started = false;
  let timers = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createParticles();
  }

  function createParticles() {
    const count = Math.min(230, Math.floor((w * h) / 5200));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      speed: .35 + Math.random() * 1.25,
      size: .5 + Math.random() * 2.2,
      alpha: .15 + Math.random() * .75,
      drift: (Math.random() - .5) * .35,
      phase: Math.random() * Math.PI * 2
    }));
  }

  function draw(t = 0) {
    ctx.clearRect(0, 0, w, h);

    // soft pink atmospheric glow
    const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h)*.65);
    g.addColorStop(0, "rgba(255, 0, 125, .075)");
    g.addColorStop(.4, "rgba(100, 0, 80, .035)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    particles.forEach(p => {
      p.y += p.speed;
      p.x += p.drift + Math.sin(t * .001 + p.phase) * .12;

      if (p.y > h + 10) {
        p.y = -10;
        p.x = Math.random() * w;
      }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;

      const twinkle = .55 + .45 * Math.sin(t * .002 + p.phase);
      ctx.fillStyle = `rgba(255, ${80 + Math.floor(Math.random()*80)}, ${155 + Math.floor(Math.random()*70)}, ${p.alpha * twinkle})`;
      ctx.shadowBlur = p.size > 1.5 ? 8 : 3;
      ctx.shadowColor = "rgba(255, 0, 130, .8)";

      if (p.size > 1.55) {
        ctx.font = "700 8px Arial";
        const rainWords = ["I LOVE YOU", "LOVE", "YOU", "❤️"];
        const word = rainWords[Math.floor((p.phase * 10 + t * .00015) % rainWords.length)];
        ctx.fillText(word, p.x, p.y);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  function buildHeartParticles() {
    const box = document.getElementById("heartParticles");
    box.innerHTML = "";

    // Parametric heart outline, plus a few nearby drifting particles.
    const points = [];
    for (let i = 0; i < 190; i++) {
      const t = (Math.PI * 2 * i) / 190;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      points.push({x, y});
    }

    // Normalize to the container.
    const xs = points.map(p => p.x);
    const ys = points.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    points.forEach((p, i) => {
      const dot = document.createElement("span");
      dot.className = "heart-dot" + (i % 4 === 0 ? " small" : "");
      const left = ((p.x - minX) / (maxX - minX)) * 82 + 9;
      const top = ((p.y - minY) / (maxY - minY)) * 82 + 8;
      dot.style.left = left + "%";
      dot.style.top = top + "%";
      dot.style.animationDelay = (-Math.random() * 1.8).toFixed(2) + "s";
      box.appendChild(dot);
    });

    // Extra loose particles around the heart, like the reference.
    for (let i = 0; i < 75; i++) {
      const dot = document.createElement("span");
      dot.className = "heart-dot small";
      dot.style.left = (5 + Math.random() * 90) + "%";
      dot.style.top = (4 + Math.random() * 90) + "%";
      dot.style.opacity = (.2 + Math.random() * .65).toFixed(2);
      box.appendChild(dot);
    }
  }

  function resetClasses() {
    you.classList.remove("show");
    are.classList.remove("show");
    my.classList.remove("show");
    love.classList.remove("show");
    heartWrap.classList.remove("show");
    subtitle.classList.remove("show");
  }

  function wait(ms, fn) {
    const id = setTimeout(fn, ms);
    timers.push(id);
  }

  function start() {
    timers.forEach(clearTimeout);
    timers = [];
    resetClasses();

    started = true;
    tap.classList.add("hide");

    // YOU -> ARE -> MY -> LOVE
    wait(350, () => you.classList.add("show"));

    wait(1500, () => {
      you.classList.remove("show");
      are.classList.add("show");
    });

    wait(2650, () => {
      are.classList.remove("show");
      my.classList.add("show");
    });

    wait(3800, () => {
      my.classList.remove("show");
      love.classList.add("show");
    });

    // Heart reveal
    wait(5150, () => {
      love.classList.remove("show");
      flash.classList.remove("go");
      void flash.offsetWidth;
      flash.classList.add("go");
    });

    wait(5600, () => {
      heartWrap.classList.add("show");
      subtitle.classList.add("show");
    });
  }

  document.addEventListener("click", () => {
    if (!started) start();
    else start();
  });

  document.addEventListener("touchstart", () => {
    if (!started) start();
  }, { passive: true });

  window.addEventListener("resize", resize);

  resize();
  buildHeartParticles();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
